services:
  flightbot:
    build: .
    container_name: flightbot
    restart: unless-stopped
    init: true
    env_file:
      - docker.env
    ports:
      - "${FLIGHTBOT_HOST_PORT:-3000}:3000"
    environment:
      FLIGHTBOT_DATA_DIR: ${FLIGHTBOT_DATA_DIR:-/data}
    volumes:
      - type: bind
        source: ${FLIGHTBOT_HOST_DATA_DIR:?Set FLIGHTBOT_HOST_DATA_DIR to an absolute host data directory outside the repo checkout}
        target: ${FLIGHTBOT_DATA_DIR:-/data}
