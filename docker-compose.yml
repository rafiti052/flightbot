services:
  flightbot:
    build: .
    container_name: flightbot
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-3000}:3000"
    environment:
      FLIGHTBOT_DATA_DIR: /data
    volumes:
      - ./:/data

  web:
    image: node:20-bookworm-slim
    container_name: flightbot-web
    working_dir: /repo
    command: bash -lc "npm ci && npm run dev -w @flightbot/web"
    ports:
      - "${WEB_PORT:-3001}:3001"
    environment:
      FLIGHTBOT_DATA_DIR: /repo
      FLIGHTBOT_BOT_URL: http://flightbot:3000
    volumes:
      - ./:/repo
    depends_on:
      - flightbot
