services:
  flightbot:
    build: .
    container_name: flightbot
    restart: unless-stopped
    init: true
    env_file:
      - docker.env
    ports:
      - "${PORT:-3000}:3000"
    environment:
      FLIGHTBOT_DATA_DIR: ${FLIGHTBOT_DATA_DIR:-/data}
    volumes:
      - ${FLIGHTBOT_HOST_DATA_DIR:-./.flightbot/docker}:${FLIGHTBOT_DATA_DIR:-/data}
